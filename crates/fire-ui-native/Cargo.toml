[package]
name = "fire-ui-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native desktop windows and optional platform services for Fire UI"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["x11"]
x11 = ["winit/x11"]
accessibility = ["dep:async-lock", "dep:unicode-segmentation", "dep:serde", "dep:accesskit", "dep:accesskit_winit", "dep:accesskit_atspi_common", "dep:atspi", "dep:zbus", "dep:async-channel", "dep:async-executor", "dep:async-task", "dep:async-io", "dep:futures-lite", "dep:futures-util"]
inspection = ["dep:serde", "dep:serde_json"]
clipboard = ["dep:arboard"]
dialogs = ["dep:native-dialog"]

[dependencies]
unicode-segmentation = { version = "1.12", optional = true }
fire-ui.workspace = true
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
arboard = { version = "3", default-features = false, optional = true }
accesskit = { version = "0.25", optional = true }
native-dialog = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux owns the AT-SPI transport to complete native range/clipboard editing.
# Other platforms retain AccessKit's native winit adapters.
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"], optional = true }
accesskit_atspi_common = { version = "=0.20.0", optional = true }
atspi = { version = "0.29", default-features = false, features = ["proxies"], optional = true }
zbus = { version = "5.5", default-features = false, features = ["async-io"], optional = true }
async-lock = { version = "3.4.2", optional = true }
async-channel = { version = "2.1.1", optional = true }
async-executor = { version = "1.5", optional = true }
async-task = { version = "4.3", optional = true }
async-io = { version = "2", optional = true }
futures-lite = { version = "2.3", optional = true }
futures-util = { version = "0.3.27", optional = true }

[dev-dependencies]
fire-ui-fonts.workspace = true
fire-ui-text.workspace = true
fire-ui-widgets.workspace = true
