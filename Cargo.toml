[workspace]
resolver = "2"
members = ["crates/fire-ui-fonts", "crates/fire-ui", "crates/fire-ui-widgets", "crates/fire-ui-native", "examples/studio", "crates/fire-ui-gl", "crates/fire-ui-cairo", "crates/fire-ui-text", "crates/fire-ui-tray"]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sobir-git/fire-ui"
keywords = ["gui", "ui", "widgets", "native", "graphics"]
categories = ["gui", "graphics"]

[workspace.dependencies]
fire-ui-fonts = { version = "0.10.0", path = "crates/fire-ui-fonts" }
fire-ui = { version = "0.10.0", path = "crates/fire-ui" }
fire-ui-widgets = { version = "0.10.0", path = "crates/fire-ui-widgets" }
fire-ui-native = { version = "0.10.0", path = "crates/fire-ui-native", default-features = false }
fire-ui-gl = { version = "0.10.0", path = "crates/fire-ui-gl" }
fire-ui-cairo = { version = "0.10.0", path = "crates/fire-ui-cairo" }

fire-ui-text = { version = "0.10.0", path = "crates/fire-ui-text" }
fire-ui-tray = { version = "0.10.0", path = "crates/fire-ui-tray" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# No debug info keeps artifacts small; incremental speeds up edit-build cycles.
# Incremental caches grow over time (6.9 GB once, with debug info); clear them
# with `rm -rf target/*/incremental` when needed.
[profile.dev]
opt-level = 1
debug = false
incremental = true

[profile.test]
opt-level = 1
debug = false
incremental = true
